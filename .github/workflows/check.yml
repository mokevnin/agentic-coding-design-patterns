name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the secret scan and the commit-message range.
          fetch-depth: 0
          persist-credentials: false
      # The runtime, package manager and linters match local development.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: --locked
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
